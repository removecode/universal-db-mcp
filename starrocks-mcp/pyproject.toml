[project]
name = "starrocks-mcp"
version = "0.1.0"
description = "StarRocks MCP Server: 多租户、apikey 鉴权、读写分离、带安全审计与监控的 SQL 查询入口"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.20.0",
    "pymysql>=1.1.0",
    "DBUtils>=3.1.0",
    "sqlparse>=0.5.0",
    "PyYAML>=6.0",
    "prometheus-client>=0.20.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
starrocks-mcp = "starrocks_mcp.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
